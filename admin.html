<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simbah Cup Admin</title>
<style>
:root {
  --bg: #0E0F12; --panel: #15171C; --line: #2C3038; --fg: #FAFAF8; --muted: #A9A79E;
  --gold: #C9A84C; --gold-hi: #F6E7B4; --bad: #E0735A; --good: #7FB88A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Segoe UI", Arial, sans-serif; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 900px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; letter-spacing: 0.06em; text-transform: uppercase; }
header h1 b { color: var(--gold); }
h2 { font-size: 20px; margin: 22px 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; }
.box { background: var(--panel); border: 1px solid var(--line); padding: 16px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.row > * { min-width: 0; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 10px; max-width: 100%; }
input[type="number"] { width: 78px; }
input.wide { width: 220px; }
input.small { width: 90px; }
button { font: inherit; font-weight: 700; cursor: pointer; border: 1px solid var(--gold); background: transparent; color: var(--fg); padding: 10px 14px; }
button.gold { background: var(--gold); color: var(--bg); border-color: var(--gold); }
button.del { border-color: var(--bad); color: var(--bad); }
button.del.sure { background: var(--bad); color: var(--bg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); margin: 16px 0; }
.tabs button { border: 0; border-right: 1px solid var(--line); padding: 14px 4px; color: var(--muted); }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-pressed="true"] { background: var(--gold); color: var(--bg); }
#msg { min-height: 24px; margin: 10px 0; font-weight: 600; }
#msg.ok { color: var(--good); }
#msg.err { color: var(--bad); }
.muted { color: var(--muted); }
.item { border-top: 1px solid var(--line); padding: 12px 0; }
.item:first-child { border-top: 0; }
.score { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.score span.v { color: var(--muted); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.thumbs figure { margin: 0; border: 1px solid var(--line); padding: 6px; background: var(--bg); display: grid; gap: 6px; }
.thumbs img, .thumbs video { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #000; }
.thumbs figcaption { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Simbah <b>Cup</b> Admin</h1>
    <button id="signOutBtn" type="button" hidden>Sign out</button>
  </header>

  <div id="msg" role="status" aria-live="polite"></div>

  <!-- Sign in -->
  <section id="loginBox" class="box" hidden>
    <h3>Sign in</h3>
    <form id="loginForm" class="row">
      <label>Email <input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Password <input id="loginPass" type="password" autocomplete="current-password" required></label>
      <button class="gold" type="submit">Sign in</button>
    </form>
  </section>

  <!-- Admin panel -->
  <section id="panel" hidden>
    <div class="box row">
      <label>Section
        <select id="compSel">
          <option value="adults">Indoor Adults</option>
          <option value="seniors">Indoor Seniors</option>
          <option value="juniors">Indoor Juniors (under 15)</option>
          <option value="outdoor">Outdoor 2026</option>
        </select>
      </label>
      <span class="muted">Teams, players and scores belong to this section.</span>
    </div>

    <nav class="tabs" aria-label="Admin sections">
      <button type="button" data-tab="teams" aria-pressed="true">Teams</button>
      <button type="button" data-tab="players" aria-pressed="false">Players</button>
      <button type="button" data-tab="scores" aria-pressed="false">Scores</button>
      <button type="button" data-tab="gallery" aria-pressed="false">Gallery</button>
    </nav>

    <div id="tabBody"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
// ---------- Setup ----------
var CFG = window.SIMBAH_CONFIG;
var db = supabase.createClient(CFG.url, CFG.key);
var COMP_NAMES = { adults: "Indoor Adults", seniors: "Indoor Seniors", juniors: "Indoor Juniors", outdoor: "Outdoor 2026" };
var currentTab = "teams";
var currentTeamId = "";   // team picked on the Players tab
var teams = [];           // teams of the chosen section

function $(id) { return document.getElementById(id); }

function esc(text) {
  return String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function say(text, kind) {
  var box = $("msg");
  box.textContent = text;
  box.className = kind || "";
}

function comp() { return $("compSel").value; }

// Turns "" into null and text numbers into numbers, for number boxes
function numOrNull(text) {
  if (text === "" || text === null || text === undefined) return null;
  return Number(text);
}

// Delete buttons ask twice: first click arms the button, second click deletes
function armDelete(button, action) {
  if (!button.classList.contains("sure")) {
    button.classList.add("sure");
    button.textContent = "Tap again to delete";
    setTimeout(function () { button.classList.remove("sure"); button.textContent = "Delete"; }, 4000);
    return;
  }
  action();
}

// ---------- Sign in ----------
async function start() {
  var result = await db.auth.getSession();
  if (result.data.session) { await checkAdmin(); } else { showLogin(); }
}

function showLogin() {
  $("loginBox").hidden = false;
  $("panel").hidden = true;
  $("signOutBtn").hidden = true;
}

async function checkAdmin() {
  var result = await db.rpc("is_admin");
  if (result.error || result.data !== true) {
    say("This account is not an admin of the Simbah Cup site.", "err");
    await db.auth.signOut();
    showLogin();
    return;
  }
  $("loginBox").hidden = true;
  $("panel").hidden = false;
  $("signOutBtn").hidden = false;
  say("", "");
  showTab("teams");
}

$("loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  say("Signing in...", "");
  var result = await db.auth.signInWithPassword({ email: $("loginEmail").value.trim(), password: $("loginPass").value });
  if (result.error) { say("Sign in failed: " + result.error.message, "err"); return; }
  await checkAdmin();
});

$("signOutBtn").addEventListener("click", async function () {
  await db.auth.signOut();
  say("Signed out.", "ok");
  showLogin();
});

$("compSel").addEventListener("change", function () { currentTeamId = ""; showTab(currentTab); });

document.querySelectorAll(".tabs button").forEach(function (b) {
  b.addEventListener("click", function () { showTab(b.getAttribute("data-tab")); });
});

async function loadTeams() {
  var result = await db.from("teams").select("*").eq("comp", comp()).order("name");
  if (result.error) { say("Could not load teams: " + result.error.message, "err"); teams = []; return; }
  teams = result.data;
}

async function showTab(name) {
  currentTab = name;
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("data-tab") === name));
  });
  say("", "");
  if (name !== "gallery") await loadTeams();
  if (name === "teams") drawTeams();
  if (name === "players") await drawPlayers();
  if (name === "scores") await drawScores();
  if (name === "gallery") await drawGallery();
}

// ---------- Teams ----------
function drawTeams() {
  var html = "<h2>Teams in " + COMP_NAMES[comp()] + "</h2>";
  html += '<div class="box"><h3>Add a team</h3><form id="addTeamForm" class="row">';
  html += '<label>Team name <input id="newTeamName" class="wide" required></label>';
  html += '<label>Short code (2 to 4 letters) <input id="newTeamCode" class="small" maxlength="4" required></label>';
  html += '<button class="gold" type="submit">Add team</button></form></div>';

  html += '<div class="box"><h3>Teams</h3>';
  if (!teams.length) html += '<p class="muted">No teams yet. Add the first one above.</p>';
  teams.forEach(function (t) {
    html += '<div class="item" data-id="' + t.id + '"><div class="row">';
    html += '<label>Name <input class="wide" data-f="name" value="' + esc(t.name) + '"></label>';
    html += '<label>Code <input class="small" data-f="code" maxlength="4" value="' + esc(t.code) + '"></label></div>';
    html += '<p class="muted" style="margin:10px 0 4px">Table figures. Leave Pts empty to work them out from the scores. Fill them in to type the table by hand (for example last season).</p>';
    html += '<div class="row">';
    ["p", "w", "l", "d", "pts"].forEach(function (f) {
      html += "<label>" + f.toUpperCase() + ' <input type="number" min="0" data-f="' + f + '" value="' + (t[f] === null ? "" : t[f]) + '"></label>';
    });
    html += '<label>NRR <input class="small" data-f="nrr" value="' + esc(t.nrr || "") + '"></label>';
    html += '<button type="button" data-act="save">Save</button><button type="button" class="del" data-act="delete">Delete</button></div></div>';
  });
  html += "</div>";
  $("tabBody").innerHTML = html;

  $("addTeamForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var result = await db.from("teams").insert({ comp: comp(), name: $("newTeamName").value.trim(), code: $("newTeamCode").value.trim().toUpperCase() });
    if (result.error) { say("Could not add the team: " + result.error.message, "err"); return; }
    await showTab("teams");
    say("Team added.", "ok");
  });

  $("tabBody").querySelectorAll(".item").forEach(function (item) {
    var id = item.getAttribute("data-id");
    item.querySelector('[data-act="save"]').addEventListener("click", async function () {
      function val(f) { return item.querySelector('[data-f="' + f + '"]').value; }
      var row = {
        name: val("name").trim(), code: val("code").trim().toUpperCase(),
        p: numOrNull(val("p")), w: numOrNull(val("w")), l: numOrNull(val("l")), d: numOrNull(val("d")),
        pts: numOrNull(val("pts")), nrr: val("nrr").trim() === "" ? null : val("nrr").trim()
      };
      var result = await db.from("teams").update(row).eq("id", id);
      say(result.error ? "Could not save: " + result.error.message : "Team saved.", result.error ? "err" : "ok");
    });
    var delBtn = item.querySelector('[data-act="delete"]');
    delBtn.addEventListener("click", function () {
      armDelete(delBtn, async function () {
        var result = await db.from("teams").delete().eq("id", id);
        if (result.error) { say("Could not delete: " + result.error.message, "err"); return; }
        await showTab("teams");
        say("Team deleted, with its players and matches.", "ok");
      });
    });
  });
}

// ---------- Players ----------
async function drawPlayers() {
  var html = "<h2>Players in " + COMP_NAMES[comp()] + "</h2>";
  if (!teams.length) {
    $("tabBody").innerHTML = html + '<p class="muted">Add a team first, on the Teams tab.</p>';
    return;
  }
  if (!currentTeamId) currentTeamId = teams[0].id;
  html += '<div class="box row"><label>Team <select id="teamSel">';
  teams.forEach(function (t) { html += '<option value="' + t.id + '"' + (t.id === currentTeamId ? " selected" : "") + ">" + esc(t.name) + "</option>"; });
  html += "</select></label></div>";

  var result = await db.from("players").select("*").eq("team_id", currentTeamId).order("shirt_no", { nullsFirst: false });
  var players = result.data || [];

  html += '<div class="box"><h3>Add a player</h3><form id="addPlayerForm" class="row">';
  html += '<label>Name <input id="newPlayerName" class="wide" required></label>';
  html += '<label>Role <input id="newPlayerRole" class="small" placeholder="Batter"></label>';
  html += '<label>Shirt no. <input id="newPlayerNo" type="number" min="0"></label>';
  html += '<button class="gold" type="submit">Add player</button></form>';
  html += '<p class="muted" style="margin-bottom:0">For junior players, only add names that parents have agreed to show on the public website.</p></div>';

  html += '<div class="box"><h3>Squad (' + players.length + ")</h3>";
  if (!players.length) html += '<p class="muted">No players yet.</p>';
  players.forEach(function (p) {
    html += '<div class="item row" data-id="' + p.id + '"><span style="flex:1 1 200px">' + (p.shirt_no ? "<b>" + p.shirt_no + "</b> " : "") + esc(p.name) + (p.role ? ' <span class="muted">' + esc(p.role) + "</span>" : "") + '</span><button type="button" class="del">Delete</button></div>';
  });
  html += "</div>";
  $("tabBody").innerHTML = html;

  $("teamSel").addEventListener("change", function () { currentTeamId = $("teamSel").value; drawPlayers(); });
  $("addPlayerForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var row = { team_id: currentTeamId, name: $("newPlayerName").value.trim(), role: $("newPlayerRole").value.trim() || null, shirt_no: numOrNull($("newPlayerNo").value) };
    var res = await db.from("players").insert(row);
    if (res.error) { say("Could not add the player: " + res.error.message, "err"); return; }
    await drawPlayers();
    say("Player added.", "ok");
  });
  $("tabBody").querySelectorAll(".item").forEach(function (item) {
    var btn = item.querySelector(".del");
    btn.addEventListener("click", function () {
      armDelete(btn, async function () {
        var res = await db.from("players").delete().eq("id", item.getAttribute("data-id"));
        if (res.error) { say("Could not delete: " + res.error.message, "err"); return; }
        await drawPlayers();
        say("Player deleted.", "ok");
      });
    });
  });
}

// ---------- Scores ----------
function teamNameById(id) {
  for (var i = 0; i < teams.length; i++) { if (teams[i].id === id) return teams[i].name; }
  return "?";
}

async function drawScores() {
  var html = "<h2>Matches and scores in " + COMP_NAMES[comp()] + "</h2>";
  if (teams.length < 2) {
    $("tabBody").innerHTML = html + '<p class="muted">Add at least two teams first, on the Teams tab.</p>';
    return;
  }
  var options = "";
  teams.forEach(function (t) { options += '<option value="' + t.id + '">' + esc(t.name) + "</option>"; });

  html += '<div class="box"><h3>Add a match</h3><form id="addMatchForm" class="row">';
  html += '<label>Home <select id="mHome">' + options + "</select></label>";
  html += '<label>Away <select id="mAway">' + options + "</select></label>";
  html += '<label>Date <input id="mDate" type="date" required></label>';
  html += '<label>Time <input id="mTime" type="time" value="10:00" required></label>';
  html += '<button class="gold" type="submit">Add match</button></form></div>';

  var result = await db.from("matches").select("*").eq("comp", comp()).order("match_date").order("match_time");
  var matches = result.data || [];

  html += '<div class="box"><h3>Matches (' + matches.length + ")</h3>";
  if (!matches.length) html += '<p class="muted">No matches yet.</p>';
  matches.forEach(function (m) {
    html += '<div class="item" data-id="' + m.id + '"><b>' + esc(teamNameById(m.home_team)) + "</b> v <b>" + esc(teamNameById(m.away_team)) + "</b>";
    html += ' <span class="muted">' + m.match_date + " " + esc(m.match_time) + (m.status === "played" ? " · played" : " · upcoming") + "</span>";
    html += '<div class="score"><span class="v">' + esc(teamNameById(m.home_team)) + '</span><input type="number" min="0" data-f="home_runs" placeholder="runs" value="' + (m.home_runs === null ? "" : m.home_runs) + '"><span>/</span><input type="number" min="0" max="10" data-f="home_wkts" placeholder="wkts" value="' + (m.home_wkts === null ? "" : m.home_wkts) + '"></div>';
    html += '<div class="score"><span class="v">' + esc(teamNameById(m.away_team)) + '</span><input type="number" min="0" data-f="away_runs" placeholder="runs" value="' + (m.away_runs === null ? "" : m.away_runs) + '"><span>/</span><input type="number" min="0" max="10" data-f="away_wkts" placeholder="wkts" value="' + (m.away_wkts === null ? "" : m.away_wkts) + '"></div>';
    html += '<div class="row"><button type="button" class="gold" data-act="save">Save score</button><button type="button" data-act="clear">Clear score</button><button type="button" class="del" data-act="delete">Delete</button></div></div>';
  });
  html += "</div>";
  $("tabBody").innerHTML = html;

  $("addMatchForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    if ($("mHome").value === $("mAway").value) { say("Pick two different teams.", "err"); return; }
    var row = { comp: comp(), home_team: $("mHome").value, away_team: $("mAway").value, match_date: $("mDate").value, match_time: $("mTime").value };
    var res = await db.from("matches").insert(row);
    if (res.error) { say("Could not add the match: " + res.error.message, "err"); return; }
    await drawScores();
    say("Match added.", "ok");
  });

  $("tabBody").querySelectorAll(".item").forEach(function (item) {
    var id = item.getAttribute("data-id");
    function val(f) { return item.querySelector('[data-f="' + f + '"]').value; }

    item.querySelector('[data-act="save"]').addEventListener("click", async function () {
      if (val("home_runs") === "" || val("away_runs") === "") { say("Enter the runs for both teams.", "err"); return; }
      var row = {
        home_runs: Number(val("home_runs")), home_wkts: Number(val("home_wkts") || 0),
        away_runs: Number(val("away_runs")), away_wkts: Number(val("away_wkts") || 0),
        status: "played"
      };
      var res = await db.from("matches").update(row).eq("id", id);
      if (res.error) { say("Could not save the score: " + res.error.message, "err"); return; }
      await drawScores();
      say("Score saved. The table updates by itself.", "ok");
    });

    item.querySelector('[data-act="clear"]').addEventListener("click", async function () {
      var row = { home_runs: null, home_wkts: null, away_runs: null, away_wkts: null, status: "upcoming" };
      var res = await db.from("matches").update(row).eq("id", id);
      if (res.error) { say("Could not clear the score: " + res.error.message, "err"); return; }
      await drawScores();
      say("Score cleared. The match is upcoming again.", "ok");
    });

    var delBtn = item.querySelector('[data-act="delete"]');
    delBtn.addEventListener("click", function () {
      armDelete(delBtn, async function () {
        var res = await db.from("matches").delete().eq("id", id);
        if (res.error) { say("Could not delete: " + res.error.message, "err"); return; }
        await drawScores();
        say("Match deleted.", "ok");
      });
    });
  });
}

// ---------- Gallery ----------
// Makes a photo smaller before upload so the site stays fast
async function shrinkImage(file) {
  var maxSide = 1600;
  var bitmap = await createImageBitmap(file);
  var scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  var canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise(function (resolve) { canvas.toBlob(resolve, "image/jpeg", 0.85); });
}

async function drawGallery() {
  var html = "<h2>Gallery</h2>";
  html += '<div class="box"><h3>Upload photos and videos</h3><form id="uploadForm" class="row">';
  html += '<label>Files <input id="upFiles" type="file" accept="image/*,video/mp4,video/quicktime,video/webm" multiple required></label>';
  html += '<label>Caption (optional) <input id="upTitle" class="wide"></label>';
  html += '<label>Section <select id="upComp"><option value="">All sections</option><option value="adults">Indoor Adults</option><option value="seniors">Indoor Seniors</option><option value="juniors">Indoor Juniors</option><option value="outdoor">Outdoor 2026</option></select></label>';
  html += '<button class="gold" type="submit">Upload</button></form>';
  html += '<p class="muted" style="margin-bottom:0">Photos are resized automatically. Videos can be up to 50 MB each. For junior players, only upload photos that parents have agreed to.</p></div>';

  var result = await db.from("gallery").select("*").order("created_at", { ascending: false });
  var items = result.data || [];
  html += '<div class="box"><h3>Uploaded (' + items.length + ")</h3>";
  if (!items.length) html += '<p class="muted">Nothing uploaded yet.</p>';
  html += '<div class="thumbs">';
  items.forEach(function (g) {
    var url = db.storage.from("gallery").getPublicUrl(g.path).data.publicUrl;
    html += '<figure data-id="' + g.id + '" data-path="' + esc(g.path) + '">';
    html += g.kind === "video" ? '<video src="' + url + '#t=0.1" preload="metadata" controls playsinline></video>' : '<img loading="lazy" src="' + url + '" alt="">';
    html += "<figcaption>" + esc(g.title || "No caption") + (g.comp ? " · " + COMP_NAMES[g.comp] : "") + '</figcaption><button type="button" class="del">Delete</button></figure>';
  });
  html += "</div></div>";
  $("tabBody").innerHTML = html;

  $("uploadForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var files = $("upFiles").files;
    var done = 0;
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      say("Uploading " + (i + 1) + " of " + files.length + "...", "");
      var isVideo = file.type.indexOf("video/") === 0;
      var body = file;
      var contentType = file.type;
      var ext = file.name.split(".").pop().toLowerCase();
      if (!isVideo) {
        try { body = await shrinkImage(file); contentType = "image/jpeg"; ext = "jpg"; }
        catch (err) { body = file; }
      }
      if (body.size > 52428800) { say(file.name + " is over 50 MB. Skipped.", "err"); continue; }
      var path = (comp() || "all") + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
      var up = await db.storage.from("gallery").upload(path, body, { contentType: contentType });
      if (up.error) { say("Upload failed for " + file.name + ": " + up.error.message, "err"); return; }
      var row = { comp: $("upComp").value || null, title: $("upTitle").value.trim(), kind: isVideo ? "video" : "image", path: path };
      var ins = await db.from("gallery").insert(row);
      if (ins.error) { say("Saved the file but not its details: " + ins.error.message, "err"); return; }
      done += 1;
    }
    await drawGallery();
    say(done + " file(s) uploaded.", "ok");
  });

  $("tabBody").querySelectorAll("figure").forEach(function (fig) {
    var btn = fig.querySelector(".del");
    btn.addEventListener("click", function () {
      armDelete(btn, async function () {
        await db.storage.from("gallery").remove([fig.getAttribute("data-path")]);
        var res = await db.from("gallery").delete().eq("id", fig.getAttribute("data-id"));
        if (res.error) { say("Could not delete: " + res.error.message, "err"); return; }
        await drawGallery();
        say("Deleted.", "ok");
      });
    });
  });
}

start();
</script>
</body>
</html>
