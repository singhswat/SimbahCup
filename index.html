<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simbah Cup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Montserrat:wght@500;700;800&family=Poppins:wght@400;500&display=swap">
<style>
/* Layout: sticky black header, hash-routed views, bottom tab bar on phones, top tabs on desktop */
:root {
  --bg: #0E0F12;
  --panel: #15171C;
  --panel-2: #1B1E24;
  --line: rgba(201, 168, 76, 0.28);
  --fg: #FAFAF8;
  --muted: #A9A79E;
  --gold: #C9A84C;
  --gold-hi: #F6E7B4;
  --gold-lo: #856F38;
  --win: #7FB88A;
  --display: "Montserrat", "Segoe UI", Arial, sans-serif;
  --body: "Poppins", "Segoe UI", Arial, sans-serif;
  --serif: "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 84px;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
a { color: var(--gold); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
.wrap { max-width: 1080px; margin: 0 auto; }
.eyebrow { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 58px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: 0.04em; color: var(--fg); text-decoration: none; display: flex; align-items: baseline; gap: 8px; }
.brand b { color: var(--gold); font-weight: 800; }
.brand small { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 15px; color: var(--gold-hi); letter-spacing: 0; }
.tabs { display: none; gap: 4px; }
.tabs a, .bottom a { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; color: var(--muted); }
.tabs a { padding: 20px 12px 17px; border-bottom: 3px solid transparent; }
.tabs a[aria-current="page"], .tabs a:hover { color: var(--fg); border-bottom-color: var(--gold); }
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.bottom a { font-size: 10px; letter-spacing: 0.06em; text-align: center; padding: 14px 2px 13px; border-top: 3px solid transparent; }
.bottom a[aria-current="page"] { color: var(--gold); border-top-color: var(--gold); }
@media (min-width: 760px) { .tabs { display: flex; } .bottom { display: none; } body { padding-block: 0 24px; } }

/* views */
.view { padding-block: 28px 12px; }
.view h2 { font-size: clamp(26px, 6vw, 38px); margin-bottom: 6px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.sample { display: inline-block; font-family: var(--display); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; border: 1px solid var(--line); color: var(--gold); padding: 4px 8px; margin-bottom: 14px; }

/* hero */
.hero { position: relative; padding-block: 44px 36px; border-bottom: 1px solid var(--line); background: radial-gradient(900px 340px at 85% 0%, rgba(201, 168, 76, 0.14), transparent 70%); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.hero h1 { font-size: clamp(40px, 11vw, 84px); letter-spacing: -0.01em; }
.hero h1 em { display: block; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 0.86em; background: linear-gradient(100deg, var(--gold-lo), var(--gold-hi) 45%, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.1em; }
.sponsors { margin: 18px 0; border: 1px solid var(--gold); background: linear-gradient(145deg, rgba(201, 168, 76, 0.10), var(--panel)); padding: 16px; display: grid; gap: 14px; }
.sponsors > h3 { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.sp { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.sp-logo { flex: 0 0 auto; display: flex; width: 64px; height: 64px; background: #fff; align-items: center; justify-content: center; padding: 6px; }
.sp.main .sp-logo { width: 96px; height: 96px; }
.sp-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.sp-text { flex: 1 1 140px; min-width: 0; }
.sp-text h4 { margin: 0 0 2px; font-size: 18px; }
.sp-text p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
.sp-text a { color: var(--gold); font-weight: 700; }
.brands { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.sbrand { display: block; width: 72px; text-align: center; font-size: 11px; color: var(--muted); text-decoration: none; }
.sbrand span.img { display: flex; align-items: center; justify-content: center; width: 72px; height: 54px; background: #fff; padding: 4px; margin-bottom: 3px; }
.sbrand img { width: 100%; height: 100%; object-fit: contain; }
.sbd-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 16px; }
.sbd { border: 1px solid var(--line); background: var(--panel); padding: 14px; }
.sbd h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.sbd ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.sbd li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
.sbd li:first-child { border-top: 0; }
.sbd .sbd-rk { width: 20px; color: var(--muted); font-size: 13px; flex: 0 0 auto; }
.sbd .sbd-who { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.sbd .sbd-who small { display: block; color: var(--muted); font-size: 12px; }
.sbd .sbd-n { font-weight: 800; font-size: 20px; flex: 0 0 auto; }
.sbd.six { grid-column: 1 / -1; border-color: var(--gold); background: linear-gradient(145deg, rgba(201, 168, 76, 0.12), var(--panel)); }
.sbd.six h3 { color: var(--gold); }
.sbd.six .sbd-n { color: var(--gold-hi); font-size: 30px; }
.sbd.six li:first-child .sbd-who { font-size: 20px; font-weight: 700; }
.sbd.out h3 { color: #E0735A; }
.sbd.out .sbd-n { color: #E0735A; }
.notice { margin: 16px 0 0; padding: 12px 14px; border: 1px solid var(--gold); background: rgba(201, 168, 76, 0.12); font-weight: 600; }
.hero p { max-width: 46ch; color: var(--muted); margin: 16px 0 24px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; padding: 14px 20px; border: 1px solid var(--gold); color: var(--fg); background: transparent; cursor: pointer; }
.btn.gold { color: var(--bg); border-color: transparent; background: linear-gradient(100deg, #A48A4A, #D9BC6A 50%, #A48A4A); }
.btn:focus-visible, .chip:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

/* grids */
.grid2 { display: grid; grid-template-columns: 1fr; gap: 20px; }
.grid3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: repeat(3, 1fr); } }
.grid2 > *, .grid3 > * { min-width: 0; }
.block { margin-top: 34px; }
.block > .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.block h3 { font-size: 20px; }
.block .head a { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; }

/* match cards */
.day { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin: 26px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.match { background: var(--panel); border: 1px solid #23262D; padding: 14px 16px; display: grid; gap: 10px; margin-bottom: 10px; }
.match .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.pill { font-family: var(--display); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--line); color: var(--gold); }
.pill.done { color: var(--win); border-color: rgba(127, 184, 138, 0.4); }
.side { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; }
.badge { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--bg); font-family: var(--display); font-size: 10px; font-weight: 800; letter-spacing: 0.04em; color: var(--gold); }
.side .nm { font-family: var(--display); font-weight: 700; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.side .sc { font-family: var(--display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.side .sc small { font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 4px; }
.side.lose .nm, .side.lose .sc { color: var(--muted); }
.result { font-size: 13px; color: var(--gold-hi); }
.vs { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 15px; padding-left: 46px; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; background: transparent; color: var(--muted); border: 1px solid #2C3038; padding: 10px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
select { font-family: var(--body); font-size: 14px; color: var(--fg); background: var(--panel); border: 1px solid #2C3038; padding: 10px 12px; max-width: 100%; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid #23262D; background: var(--panel); margin-bottom: 18px; }
table { border-collapse: collapse; width: 100%; min-width: 440px; font-variant-numeric: tabular-nums; }
caption { text-align: left; padding: 14px 16px; font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--line); }
th { font-family: var(--display); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 10px 12px; }
td { padding: 12px; text-align: right; border-top: 1px solid #23262D; }
th:nth-child(2), td:nth-child(2) { text-align: left; }
th:first-child, td:first-child { text-align: center; width: 36px; color: var(--muted); }
td.team { font-family: var(--display); font-weight: 700; }
td.pts { font-family: var(--display); font-weight: 800; color: var(--gold-hi); }
tr.q td:first-child { box-shadow: inset 3px 0 0 var(--gold); color: var(--gold); }
.note { font-size: 12px; color: var(--muted); }

/* teams, news, stats */
.team-card { background: var(--panel); border: 1px solid #23262D; padding: 18px; display: grid; gap: 4px; }
.team-card .badge { width: 46px; height: 46px; font-size: 12px; margin-bottom: 8px; }
.team-card h3 { font-size: 17px; }
.news { background: var(--panel); border: 1px solid #23262D; padding: 18px; display: grid; gap: 8px; align-content: start; }
.news h3 { font-size: 18px; line-height: 1.2; }
.news time { font-size: 12px; color: var(--muted); }
.leader { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid #23262D; }
.leader:first-of-type { border-top: 0; }
.leader .n { font-family: var(--display); font-weight: 800; color: var(--gold); }
.leader .who { min-width: 0; overflow-wrap: anywhere; }
.leader .who small { display: block; color: var(--muted); font-size: 12px; }
.leader .v { font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid #23262D; }
.panel > h3 { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); padding: 14px 16px; border-bottom: 1px solid var(--line); }
.venue { background: var(--panel); border: 1px solid var(--line); padding: 22px; }
.venue h3 { font-size: 22px; margin: 6px 0 10px; }

footer { margin-top: 48px; padding-block: 28px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 8px; }
footer b { font-family: var(--display); color: var(--fg); letter-spacing: 0.06em; }

.rank { background: var(--panel); border: 1px solid #23262D; border-top: 3px solid var(--gold); min-width: 0; align-self: start; }
.rank h3 { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; padding: 16px; color: var(--gold); border-bottom: 1px solid #23262D; }
.rrow { display: grid; grid-template-columns: 30px 34px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-top: 1px solid #23262D; }
.rrow:first-child { border-top: 0; }
.rrow.first { background: var(--panel-2); padding-block: 22px; }
.rrow .pos { font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--muted); }
.rrow .nm { font-family: var(--display); font-weight: 700; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.rrow.first .nm { font-size: 18px; font-weight: 800; }
.rrow .pts { font-family: var(--display); font-weight: 800; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.rank .more { display: block; text-align: center; padding: 14px; border-top: 1px solid #23262D; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; }
.hero h1 em { font-size: 0.5em; margin-top: 6px; }
.grid2.block > section:last-child .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.grid2.block > section:last-child h3 { font-size: 20px; }
.grid2.block > section:last-child .head a { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; }

.sbrand img { height: 40px; width: auto; display: block; align-self: center; }
.brand small { display: none; }
@media (min-width: 560px) { .brand small { display: inline; } }
.hero-in { display: flex; flex-wrap: wrap-reverse; align-items: center; justify-content: space-between; gap: 28px; }
.hero-copy { flex: 1 1 320px; min-width: 0; }
.crest { flex: 0 1 300px; width: 300px; max-width: 70%; height: auto; margin-inline: auto; display: block; }
@media (min-width: 760px) { .crest { max-width: 300px; margin-inline: 0; } }

/* sections */
.t-adults { --tier: #C9A84C; }
.t-seniors { --tier: #C3CAD3; }
.t-juniors { --tier: #E08A58; }
.t-outdoor { --tier: #7FB88A; }
.lead-in { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; }
.tiles { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 760px) { .tiles.three { grid-template-columns: repeat(3, 1fr); } }
.tile { position: relative; overflow: hidden; display: grid; gap: 6px; align-content: start; min-height: 210px; padding: 20px; text-decoration: none; color: var(--fg); background: var(--panel); border: 1px solid #23262D; border-top: 4px solid var(--tier); min-width: 0; }
.tile:hover, .tile:focus-visible { background: var(--panel-2); }
.tile .ghost { position: absolute; right: -6px; bottom: -18px; font-family: var(--display); font-weight: 800; font-size: clamp(64px, 16vw, 104px); line-height: 1; color: transparent; -webkit-text-stroke: 1px var(--tier); opacity: 0.35; pointer-events: none; }
.tile .eyebrow { color: var(--tier); }
.tile h3 { font-size: 28px; }
.tile .age { margin: 0; color: var(--muted); font-size: 14px; }
.tile .line { margin-top: 8px; font-size: 13px; color: var(--gold-hi); position: relative; }
.tile .go { margin-top: 8px; font-family: var(--display); font-weight: 800; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tier); position: relative; }
.tile .pill { justify-self: start; color: var(--tier); border-color: var(--tier); position: relative; }
.tile.wide { min-height: 0; }
.how { background: var(--panel); border: 1px solid var(--line); padding: 22px; margin-top: 34px; display: grid; gap: 6px; }
.how h3 { font-size: 20px; }

/* competition page */
.comp .pill { color: var(--tier); border-color: var(--tier); margin-bottom: 4px; display: inline-block; }
.comp h2 { margin-top: 8px; }
.comp h2::after { content: ""; display: block; width: 64px; height: 4px; background: var(--tier); margin-top: 12px; }
.subtabs { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid #2C3038; margin: 22px 0 20px; }
.subtabs a { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; text-align: center; padding: 13px 4px; color: var(--muted); border-right: 1px solid #2C3038; }
.subtabs a:last-child { border-right: 0; }
.subtabs a[aria-current="page"] { background: var(--tier); color: var(--bg); }
.empty { background: var(--panel); border: 1px dashed var(--tier); padding: 28px 20px; display: grid; gap: 8px; }
.empty h3 { font-size: 20px; color: var(--tier); }
.empty p { margin: 0; }
.comp .badge { border-color: var(--tier); color: var(--tier); }
.comp caption { color: var(--tier); }
.comp .day { color: var(--tier); }
.hero-sub { max-width: 46ch; color: var(--muted); margin: 16px 0 0; }

/* juniors: lively */
.t-juniors { --tier: #FF8A3D; --sun: #FFD23F; --mint: #3DDBD0; --pink: #FF5FA2; }
.ball { position: absolute; top: 18px; right: 20px; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 35% 30%, #ff7a6b, #c4261d 62%, #8e1812); box-shadow: 0 6px 0 -2px rgba(0, 0, 0, 0.35); }
.ball::before { content: ""; position: absolute; left: -15%; top: 48%; width: 130%; height: 0; border-top: 2px dashed rgba(255, 255, 255, 0.9); transform: rotate(-28deg); }
.ball.big { width: 52px; height: 52px; top: 0; right: 0; }
.tile.t-juniors { border-radius: 24px; border: 2px solid var(--tier); border-top-width: 2px; background:
  radial-gradient(circle at 12% 18%, var(--sun) 0 3px, transparent 4px),
  radial-gradient(circle at 78% 62%, var(--mint) 0 4px, transparent 5px),
  radial-gradient(circle at 46% 86%, var(--pink) 0 3px, transparent 4px),
  radial-gradient(circle at 90% 12%, var(--sun) 0 2px, transparent 3px),
  linear-gradient(145deg, rgba(255, 138, 61, 0.22), rgba(61, 219, 208, 0.10) 70%, var(--panel)); }
.tile.t-juniors h3 { font-size: 32px; color: var(--sun); }
.tile.t-juniors .ghost { -webkit-text-stroke: 2px var(--mint); opacity: 0.55; transform: rotate(-6deg); }
.tile.t-juniors .eyebrow, .tile.t-juniors .go { color: var(--mint); }
.tile.t-juniors .pill { border-radius: 99px; background: var(--sun); color: #1A1300; border-color: var(--sun); padding: 4px 12px; }
.tile.t-juniors .line { color: var(--fg); font-weight: 500; }
.comp.t-juniors { position: relative; }
.comp.t-juniors h2 { background: linear-gradient(90deg, var(--sun), var(--tier) 55%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.1em; width: fit-content; max-width: 100%; }
.comp.t-juniors h2::after { height: 8px; border-radius: 99px; width: 96px; background: linear-gradient(90deg, var(--mint), var(--sun), var(--pink)); }
.comp.t-juniors .pill { border-radius: 99px; background: var(--sun); color: #1A1300; border-color: var(--sun); padding: 4px 12px; }
.comp.t-juniors .subtabs { border: 0; gap: 8px; }
.comp.t-juniors .subtabs a { border: 2px solid #2C3038; border-radius: 99px; padding: 12px 4px; }
.comp.t-juniors .subtabs a:nth-child(1)[aria-current="page"] { background: var(--sun); border-color: var(--sun); color: #1A1300; }
.comp.t-juniors .subtabs a:nth-child(2)[aria-current="page"] { background: var(--mint); border-color: var(--mint); color: #04201E; }
.comp.t-juniors .subtabs a:nth-child(3)[aria-current="page"] { background: var(--pink); border-color: var(--pink); color: #2A0616; }
.comp.t-juniors .subtabs a:nth-child(4)[aria-current="page"] { background: var(--tier); border-color: var(--tier); color: #2A1200; }
.comp.t-juniors .empty { border-radius: 24px; border: 2px dashed var(--mint); background: linear-gradient(145deg, rgba(61, 219, 208, 0.10), var(--panel)); }
.comp.t-juniors .empty h3 { font-size: 24px; color: var(--sun); }
.comp.t-juniors .match, .comp.t-juniors .tbl-wrap, .comp.t-juniors .team-card { border-radius: 18px; }
.comp.t-juniors .badge { border-radius: 50%; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-22px) rotate(160deg); } 60% { transform: translateY(-22px) rotate(200deg); } }
  .ball { animation: hop 1.6s ease-in-out infinite; }
  .tile.t-juniors:hover { transform: rotate(-1deg) scale(1.01); transition: transform 0.2s; }
}

[hidden] { display: none !important; }
.bottom { grid-auto-flow: column; grid-auto-columns: 1fr; }
.bottom a { font-size: 9px; letter-spacing: 0.02em; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
.gitem { padding: 0; border: 1px solid #23262D; background: var(--panel); cursor: pointer; display: block; min-width: 0; }
.gitem img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.gvid { margin: 0; grid-column: span 2; min-width: 0; }
.gvid video { width: 100%; max-height: 320px; background: #000; display: block; }
.gvid figcaption { font-size: 12px; color: var(--muted); padding-top: 4px; }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.92); display: grid; place-items: center; padding: 56px 12px 12px; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lbx { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bg); background: var(--gold); border: 0; padding: 12px 18px; cursor: pointer; }
.squad { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.squad b { color: var(--gold); font-family: var(--display); margin-right: 4px; }
.team-card summary { cursor: pointer; margin-top: 10px; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

// ---------- Data ----------
var EMAIL = "info@simbahcup.co.uk";
var PHONE = "+44 7840 925593";
var VENUE = "Milton Keynes";
var HERO_TEXT = "Indoor and outdoor cricket. Pick your section to see the table, fixtures and results.";
var NOTICE = "";
var sponsorList = [];
var statTeams = [];
var statPlayers = [];
var brandList = [];

var CFG = window.SIMBAH_CONFIG || {};
var db = null;            // database connection, created in loadData()
var loadState = "loading"; // "loading", "ready" or "error"
var galleryItems = [];

// Points for the tables that are worked out from scores
var WIN_POINTS = 2;
var TIE_POINTS = 1;

// The four sections. Teams, fixtures and players are filled in from the database.
var COMPS = {
  adults:  { key: "adults",  title: "Indoor Adults",  name: "Adults",  season: "Indoor", age: "Open to adult players", ghost: "OPEN",   status: "Entries open" },
  seniors: { key: "seniors", title: "Indoor Seniors", name: "Seniors", season: "Indoor", age: "Senior players",        ghost: "SENIOR", status: "Entries open" },
  juniors: { key: "juniors", title: "Indoor Juniors", name: "Juniors", season: "Indoor", age: "Under 15 · Come and play", ghost: "U15", status: "Entries open" },
  outdoor: { key: "outdoor", title: "Outdoor 2026",   name: "Outdoor", season: "Outdoor 2026", age: "Season complete", ghost: "2026", status: "Completed" }
};

function esc(text) {
  return String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Works out one team's row. If the admin typed table figures by hand (points filled in), use those.
function teamRow(team, matches) {
  var row = { id: team.id, code: esc(team.code), name: esc(team.name), p: 0, w: 0, l: 0, d: 0, pts: 0, nrr: "-" };
  if (team.pts !== null && team.pts !== undefined) {
    row.p = team.p || 0; row.w = team.w || 0; row.l = team.l || 0; row.d = team.d || 0;
    row.pts = team.pts; row.nrr = team.nrr || "-";
    return row;
  }
  matches.forEach(function (m) {
    if (m.status !== "played") return;
    var isHome = m.home_team === team.id;
    var isAway = m.away_team === team.id;
    if (!isHome && !isAway) return;
    var mine = isHome ? m.home_runs : m.away_runs;
    var theirs = isHome ? m.away_runs : m.home_runs;
    row.p += 1;
    if (mine > theirs) { row.w += 1; row.pts += WIN_POINTS; }
    else if (mine < theirs) { row.l += 1; }
    else { row.d += 1; row.pts += TIE_POINTS; }
  });
  return row;
}

// Fills one section from the rows the database returned
function fillComp(comp, teams, players, matches) {
  var compTeams = teams.filter(function (t) { return t.comp === comp.key; });
  var compMatches = matches.filter(function (m) { return m.comp === comp.key; });
  var idToCode = {};
  compTeams.forEach(function (t) { idToCode[t.id] = esc(t.code); });

  comp.table = compTeams.map(function (t) { return teamRow(t, compMatches); });
  comp.table.sort(function (a, b) { return b.pts - a.pts || b.w - a.w || a.name.localeCompare(b.name); });

  comp.players = {};
  players.forEach(function (p) {
    if (!comp.players[p.team_id]) comp.players[p.team_id] = [];
    comp.players[p.team_id].push(p);
  });

  comp.fixtures = compMatches.map(function (m) {
    var f = { home: idToCode[m.home_team], away: idToCode[m.away_team], date: m.match_date, time: m.match_time };
    if (m.status === "played") f.r = [m.home_runs || 0, m.home_wkts || 0, m.away_runs || 0, m.away_wkts || 0];
    return f;
  });
  comp.fixtures.sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
}

async function loadData() {
  try {
    db = supabase.createClient(CFG.url, CFG.key);
    var teams = await db.from("teams").select("*");
    var players = await db.from("players").select("*").order("shirt_no", { nullsFirst: false });
    var matches = await db.from("matches").select("*");
    var gallery = await db.from("gallery").select("*").order("created_at", { ascending: false });
    if (teams.error || players.error || matches.error || gallery.error) throw new Error("load failed");
    Object.keys(COMPS).forEach(function (key) { fillComp(COMPS[key], teams.data, players.data, matches.data); });
    galleryItems = gallery.data;
    statTeams = teams.data;
    statPlayers = players.data;
    // Sponsors are optional: if they fail to load the rest of the site still works.
    var sp = await db.from("sponsors").select("*").order("sort_no");
    var br = await db.from("sponsor_brands").select("*").order("created_at");
    if (!sp.error && !br.error) { sponsorList = sp.data; brandList = br.data; }
    // Site settings from the admin page. If they fail to load, the defaults above stay.
    var settings = await db.from("settings").select("*");
    if (!settings.error) {
      settings.data.forEach(function (row) {
        if (row.key === "email" && row.value) EMAIL = row.value;
        if (row.key === "phone" && row.value) PHONE = row.value;
        if (row.key === "hero_text" && row.value) HERO_TEXT = row.value;
        if (row.key === "notice") NOTICE = row.value;
      });
    }
    loadState = "ready";
  } catch (err) {
    loadState = "error";
  }
  show();
}

function publicUrl(path) {
  if (path.indexOf("data:") === 0) return path;
  return db.storage.from("gallery").getPublicUrl(path).data.publicUrl;
}

// ---------- Helpers ----------
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function teamName(comp, code) {
  for (var i = 0; i < comp.table.length; i++) { if (comp.table[i].code === code) return comp.table[i].name; }
  return code;
}
function longDate(iso) {
  var d = new Date(iso + "T12:00:00");
  return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
}
function shortDate(iso) {
  var d = new Date(iso + "T12:00:00");
  return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function matchResult(comp, f) {
  var hr = f.r[0], ar = f.r[2], aw = f.r[3];
  if (hr > ar) return { winner: f.home, text: teamName(comp, f.home) + " won by " + (hr - ar) + " runs" };
  if (ar > hr) return { winner: f.away, text: teamName(comp, f.away) + " won by " + (10 - aw) + " wickets" };
  return { winner: null, text: "Match tied" };
}

function matchCard(comp, f) {
  var done = !!f.r;
  var res = done ? matchResult(comp, f) : null;
  var html = '<article class="match"><div class="meta"><span>' + shortDate(f.date) + " · " + f.time + "</span>";
  html += done ? '<span class="pill done">Full time</span>' : '<span class="pill">Upcoming</span>';
  html += "</div>";
  var homeLose = done && res.winner !== null && res.winner !== f.home;
  var awayLose = done && res.winner !== null && res.winner !== f.away;
  html += '<div class="side' + (homeLose ? " lose" : "") + '"><span class="badge">' + f.home + '</span><span class="nm">' + teamName(comp, f.home) + "</span>";
  html += done ? '<span class="sc">' + f.r[0] + "/" + f.r[1] + "</span>" : "<span></span>";
  html += "</div>";
  if (!done) html += '<div class="vs">versus</div>';
  html += '<div class="side' + (awayLose ? " lose" : "") + '"><span class="badge">' + f.away + '</span><span class="nm">' + teamName(comp, f.away) + "</span>";
  html += done ? '<span class="sc">' + f.r[2] + "/" + f.r[3] + "</span>" : "<span></span>";
  html += "</div>";
  html += done ? '<div class="result">' + res.text + "</div>" : '<div class="meta"><span>' + VENUE + "</span></div>";
  return html + "</article>";
}

function fullTable(comp) {
  var html = '<div class="tbl-wrap"><table><caption>' + comp.title + "</caption><thead><tr>";
  ["#", "Team", "P", "W", "L", "D", "Pts", "NRR"].forEach(function (h) { html += '<th scope="col">' + h + "</th>"; });
  html += "</tr></thead><tbody>";
  comp.table.forEach(function (t, i) {
    html += "<tr><td>" + (i + 1) + '</td><td class="team">' + t.name + "</td><td>" + t.p + "</td><td>" + t.w + "</td><td>" + t.l + "</td><td>" + t.d + '</td><td class="pts">' + t.pts + "</td><td>" + t.nrr + "</td></tr>";
  });
  return html + "</tbody></table></div>";
}

function emptyState(comp, what) {
  var open = comp.status === "Entries open";
  if (comp.key === "juniors") {
    return '<div class="empty"><h3>Calling all young cricketers!</h3><p>Under 15 and love cricket? Bring your friends and come and play. Teams, fixtures and results will pop up here as soon as the draw is made.</p><p class="muted">To sign up a team, email <b>' + EMAIL + "</b> or call <b>" + PHONE + "</b>.</p></div>";
  }
  var html = '<div class="empty"><h3>' + (open ? "Entries are open" : "Nothing published yet") + "</h3>";
  if (open) {
    html += "<p>" + what + " for " + comp.title + " will appear here once the draw is made.</p>";
    html += '<p class="muted">To enter a team, email <b>' + EMAIL + "</b> or call <b>" + PHONE + "</b>.</p>";
  } else {
    html += "<p>" + what + " have not been published for " + comp.title + ".</p>";
  }
  return html + "</div>";
}

// ---------- Home ----------
function leadLine(c) {
  if (c.key === "juniors" && !c.table.length) return "Calling all young cricketers";
  return c.table.length ? "Table leader: " + c.table[0].name : "Teams being confirmed";
}
function tile(c, wide) {
  var html = '<a class="tile t-' + c.key + (wide ? " wide" : "") + '" href="#' + c.key + '"><span class="ghost">' + c.ghost + "</span>" + (c.key === "juniors" ? '<span class="ball" aria-hidden="true"></span>' : "");
  html += '<span class="eyebrow">' + c.season + "</span><h3>" + c.name + '</h3><p class="age">' + c.age + "</p>";
  html += '<span class="pill">' + c.status + '</span><span class="line">' + leadLine(c) + '</span><span class="go">View section &rsaquo;</span></a>';
  return html;
}

// Sponsor container. compKey is a section key, or "all" for the home page.
function sponsorBox(compKey) {
  var list = sponsorList.filter(function (sp) { return compKey === "all" || sp.comp === compKey || !sp.comp; });
  if (!list.length) return "";
  list.sort(function (a, b) { return (b.main ? 1 : 0) - (a.main ? 1 : 0); });
  var html = '<section class="sponsors" aria-label="Sponsors"><h3>' + (list.length > 1 ? "Our sponsors" : "Presented by") + "</h3>";
  list.forEach(function (sp) {
    html += '<div class="sp' + (sp.main ? " main" : "") + '">';
    if (sp.logo_path) html += '<div class="sp-logo"><img src="' + publicUrl(sp.logo_path) + '" alt="' + esc(sp.name) + ' logo" loading="lazy"></div>';
    html += '<div class="sp-text"><h4>' + esc(sp.name) + "</h4>";
    if (sp.blurb) html += "<p>" + esc(sp.blurb) + "</p>";
    if (sp.website) html += '<a href="' + esc(sp.website) + '" target="_blank" rel="noopener">Visit website</a>';
    var mine = brandList.filter(function (b) { return b.sponsor_id === sp.id; });
    if (mine.length) {
      html += '<div class="brands">';
      mine.forEach(function (b) {
        var inner = '<span class="img">' + (b.image_path ? '<img src="' + publicUrl(b.image_path) + '" alt="" loading="lazy">' : "") + "</span>" + esc(b.name);
        html += b.website ? '<a class="sbrand" href="' + esc(b.website) + '" target="_blank" rel="noopener">' + inner + "</a>" : '<div class="sbrand">' + inner + "</div>";
      });
      html += "</div>";
    }
    html += "</div></div>";
  });
  return html + "</section>";
}

// ---------- Stats: sixes, fours, twos, singles, run outs ----------
var STAT_BOARDS = [
  ["sixes", "Most sixes", "six"],
  ["fours", "Most fours", ""],
  ["twos", "Most twos", ""],
  ["ones", "Most singles", ""],
  ["run_outs", "Run-out club", "out"]
];

// Players with their team name and section, optionally for one section only
function statRows(compKey) {
  var teamById = {};
  statTeams.forEach(function (t) { teamById[t.id] = t; });
  var rows = [];
  statPlayers.forEach(function (p) {
    var t = teamById[p.team_id];
    if (!t) return;
    if (compKey !== "all" && t.comp !== compKey) return;
    rows.push({ name: p.name, team: t.name, comp: t.comp, sixes: p.sixes || 0, fours: p.fours || 0, twos: p.twos || 0, ones: p.ones || 0, run_outs: p.run_outs || 0 });
  });
  return rows;
}

function boardHtml(rows, field, title, cls, limit) {
  var list = rows.filter(function (r) { return r[field] > 0; });
  list.sort(function (a, b) { return b[field] - a[field] || a.name.localeCompare(b.name); });
  var html = '<section class="sbd ' + cls + '"><h3>' + title + "</h3>";
  if (!list.length) return html + '<p class="muted" style="margin:0">Nothing yet.</p></section>';
  html += "<ol>";
  list.slice(0, limit).forEach(function (r, i) {
    html += '<li><span class="sbd-rk">' + (i + 1) + '</span><span class="sbd-who">' + esc(r.name) + "<small>" + esc(r.team) + '</small></span><span class="sbd-n">' + r[field] + "</span></li>";
  });
  return html + "</ol></section>";
}

function viewStats() {
  var html = '<h2>Player stats</h2><p class="sub">It is all about the sixes. Then fours, twos and singles. And the run-out club.</p>';
  html += '<div class="filters"><select id="statSel" aria-label="Section"><option value="all">All sections</option>';
  Object.keys(COMPS).forEach(function (k) { html += '<option value="' + k + '">' + COMPS[k].title + "</option>"; });
  html += '</select></div><div id="statGrid" class="sbd-grid"></div>';
  return html;
}

function wireStats() {
  var sel = document.getElementById("statSel");
  function draw() {
    var rows = statRows(sel.value);
    var html = "";
    STAT_BOARDS.forEach(function (b) { html += boardHtml(rows, b[0], b[1], b[2], b[2] === "six" ? 10 : 5); });
    document.getElementById("statGrid").innerHTML = html;
  }
  sel.addEventListener("change", draw);
  draw();
}

function viewHome() {
  var html = "";
  if (NOTICE) html += '<p class="notice" role="status">' + esc(NOTICE) + "</p>";
  html += '<section class="hero"><div class="hero-in"><div class="hero-copy"><p class="eyebrow">Milton Keynes · Cricket</p>';
  html += "<h1>Simbah Cup<em>The Roar of Cricket</em></h1>";
  html += '<p class="hero-sub">' + esc(HERO_TEXT) + "</p></div>";
  html += '<img class="crest" src="' + CREST + '" alt="Simbah Cup crest: a crowned lion inside a gold laurel wreath" width="320" height="297"></div></section>';

  html += '<p class="lead-in">Indoor · Now open</p><div class="tiles three">' + tile(COMPS.adults) + tile(COMPS.seniors) + tile(COMPS.juniors) + "</div>";
  html += '<p class="lead-in">Outdoor · Last season</p><div class="tiles">' + tile(COMPS.outdoor, true) + "</div>";

  html += sponsorBox("all");
  var topSix = statRows("all").filter(function (r) { return r.sixes > 0; });
  topSix.sort(function (a, b) { return b.sixes - a.sixes || a.name.localeCompare(b.name); });
  if (topSix.length) {
    html += '<p class="lead-in">Six-hitters</p><div class="sbd-grid" style="margin-top:0">' + boardHtml(statRows("all"), "sixes", "Most sixes", "six", 3) + "</div>";
    html += '<p style="margin:8px 0 0"><a href="#stats" style="color:var(--gold);font-weight:700">See all player stats</a></p>';
  }
  if (galleryItems.length) {
    html += '<p class="lead-in">Latest from the gallery</p><div class="gal">';
    galleryItems.filter(function (g) { return g.kind === "image"; }).slice(0, 4).forEach(function (g) {
      html += '<a class="gitem" href="#gallery"><img loading="lazy" src="' + publicUrl(g.path) + '" alt="' + esc(g.title || "Simbah Cup photo") + '"></a>';
    });
    html += "</div>";
  }
  html += '<div class="how"><p class="eyebrow">Enter a team</p><h3>Not sure which section?</h3>';
  html += '<p class="muted" style="margin:0">Juniors are players under 15. Everyone else plays in Adults or Seniors. Email <b>' + EMAIL + "</b> or call <b>" + PHONE + "</b> and we will place you.</p></div>";
  return html;
}

// ---------- Competition page ----------
var teamFilter = "all";
var TABS = [["table", "Table"], ["fixtures", "Fixtures"], ["results", "Results"], ["teams", "Teams"]];

function viewComp(comp, tab) {
  var html = '<div class="comp t-' + comp.key + '">' + (comp.key === "juniors" ? '<span class="ball big" aria-hidden="true"></span>' : "") + '<p class="eyebrow" style="color:var(--tier)">' + comp.season + " · " + comp.age + "</p>";
  html += "<h2>" + comp.title + '</h2><span class="pill">' + comp.status + "</span>";
  html += '<nav class="subtabs" aria-label="' + comp.title + '">';
  TABS.forEach(function (t) {
    html += '<a href="#' + comp.key + (t[0] === "table" ? "" : "-" + t[0]) + '"' + (t[0] === tab ? ' aria-current="page"' : "") + ">" + t[1] + "</a>";
  });
  html += "</nav>";
  html += sponsorBox(comp.key);

  if (tab === "table") {
    html += comp.table.length ? fullTable(comp) + '<p class="note">P played, W won, L lost, D drawn, Pts points, NRR net run rate.</p>' : emptyState(comp, "The table");
  } else if (tab === "teams") {
    if (!comp.table.length) html += emptyState(comp, "Teams");
    else {
      html += '<div class="grid3">';
      comp.table.forEach(function (t, i) {
        var squad = comp.players[t.id] || [];
        html += '<article class="team-card"><span class="badge">' + t.code + "</span><h3>" + t.name + '</h3><span class="muted" style="font-size:13px">Position ' + (i + 1) + " · Played " + t.p + " · Won " + t.w + " · " + t.pts + " pts</span>";
        if (squad.length) {
          html += '<details><summary>Players (' + squad.length + ")</summary><ul class=\"squad\">";
          squad.forEach(function (p) {
            html += "<li>" + (p.shirt_no ? '<b>' + p.shirt_no + "</b> " : "") + esc(p.name) + (p.role ? ' <span class="muted">' + esc(p.role) + "</span>" : "") + "</li>";
          });
          html += "</ul></details>";
        }
        html += "</article>";
      });
      html += "</div>";
    }
  } else {
    var pool = comp.fixtures.filter(function (f) { return tab === "results" ? !!f.r : !f.r; });
    if (!comp.fixtures.length) html += emptyState(comp, tab === "results" ? "Results" : "Fixtures");
    else {
      html += '<div class="filters"><select id="teamSel" aria-label="Team"><option value="all">All teams</option>';
      comp.table.forEach(function (t) { html += '<option value="' + t.code + '">' + t.name + "</option>"; });
      html += '</select></div><div id="matchList"></div>';
    }
  }
  return html + "</div>";
}

function drawMatchList(comp, tab) {
  var list = comp.fixtures.filter(function (f) {
    if (tab === "results" && !f.r) return false;
    if (tab === "fixtures" && f.r) return false;
    if (teamFilter !== "all" && f.home !== teamFilter && f.away !== teamFilter) return false;
    return true;
  });
  var html = "";
  var lastDay = "";
  list.forEach(function (f) {
    if (f.date !== lastDay) { html += '<div class="day">' + longDate(f.date) + "</div>"; lastDay = f.date; }
    html += matchCard(comp, f);
  });
  if (!list.length) html = '<p class="muted" style="margin-top:24px">' + (tab === "results" ? "No results yet." : "No upcoming matches found.") + "</p>";
  document.getElementById("matchList").innerHTML = html;
}

function wireMatches(comp, tab) {
  var sel = document.getElementById("teamSel");
  if (!sel) return;
  sel.value = teamFilter;
  sel.addEventListener("change", function () { teamFilter = sel.value; drawMatchList(comp, tab); });
  drawMatchList(comp, tab);
}

function viewContact() {
  var html = "<h2>Contact</h2><p class=\"sub\">Questions about fixtures, teams or entering the Simbah Cup.</p>";
  html += '<div class="venue"><p class="eyebrow">Simbah Cup</p><h3>' + VENUE + ", UK</h3>";
  html += '<p style="margin:0 0 6px">Email: <b>' + EMAIL + "</b></p><p style=\"margin:0 0 6px\">Phone: <b>" + PHONE + "</b></p>";
  html += '<p class="muted" style="margin:0">Presented by <a href="https://simbahsports.co.uk">Simbah Sports</a>.</p></div>';
  return html;
}


// ---------- Gallery ----------
var galleryFilter = "all";

function viewGallery() {
  var html = "<h2>Gallery</h2><p class=\"sub\">Photos and videos from the Simbah Cup.</p>";
  html += '<div class="filters"><select id="galSel" aria-label="Section"><option value="all">All sections</option>';
  Object.keys(COMPS).forEach(function (k) { html += '<option value="' + k + '">' + COMPS[k].title + "</option>"; });
  html += '</select></div><div id="galGrid" class="gal"></div>';
  return html;
}

function drawGallery() {
  var list = galleryItems.filter(function (g) { return galleryFilter === "all" || g.comp === galleryFilter; });
  var html = "";
  list.forEach(function (g) {
    var url = publicUrl(g.path);
    if (g.kind === "video") {
      html += '<figure class="gvid"><video controls playsinline preload="metadata" src="' + url + '#t=0.1"></video><figcaption>' + esc(g.title) + "</figcaption></figure>";
    } else {
      html += '<button class="gitem" data-src="' + url + '" data-title="' + esc(g.title) + '"><img loading="lazy" src="' + url + '" alt="' + esc(g.title || "Simbah Cup photo") + '"></button>';
    }
  });
  if (!list.length) html = '<div class="empty" style="grid-column:1/-1"><h3>No photos or videos yet</h3><p>Pictures from the matches will appear here.</p></div>';
  document.getElementById("galGrid").innerHTML = html;
}

function wireGallery() {
  var sel = document.getElementById("galSel");
  sel.value = galleryFilter;
  sel.addEventListener("change", function () { galleryFilter = sel.value; drawGallery(); });
  document.getElementById("galGrid").addEventListener("click", function (e) {
    var btn = e.target.closest(".gitem");
    if (!btn) return;
    document.getElementById("lbimg").src = btn.getAttribute("data-src");
    document.getElementById("lbimg").alt = btn.getAttribute("data-title");
    document.getElementById("lb").hidden = false;
  });
  drawGallery();
}

function closeLightbox() {
  document.getElementById("lb").hidden = true;
  document.getElementById("lbimg").src = "";
}

// ---------- Routing ----------
// Hash examples: #home, #adults, #adults-fixtures, #juniors-results, #outdoor-teams, #contact
var NAV = [["home", "Home"], ["adults", "Adults"], ["seniors", "Seniors"], ["juniors", "Juniors"], ["outdoor", "Outdoor"], ["stats", "Stats"], ["gallery", "Gallery"], ["contact", "Contact"]];

function buildNav() {
  var html = "";
  NAV.forEach(function (n) { html += '<a href="#' + n[0] + '" data-key="' + n[0] + '">' + n[1] + "</a>"; });
  document.getElementById("tabs").innerHTML = html;
  document.getElementById("bottom").innerHTML = html;
}

function show() {
  var parts = location.hash.replace("#", "").split("-");
  var key = parts[0];
  var tab = parts[1] || "table";
  var content, after;
  if (loadState === "loading") {
    content = '<p class="muted" style="padding-top:40px">Loading...</p>';
  } else if (loadState === "error") {
    content = '<div class="empty" style="margin-top:40px"><h3>The site could not load its data</h3><p>Please refresh the page. If this keeps happening, email <b>' + EMAIL + "</b>.</p></div>";
  } else if (key === "gallery") {
    content = viewGallery();
    after = wireGallery;
  } else if (key === "stats") {
    content = viewStats();
    after = wireStats;
  } else if (COMPS[key]) {
    content = viewComp(COMPS[key], tab);
    after = function () { wireMatches(COMPS[key], tab); };
  } else if (key === "contact") {
    content = viewContact();
  } else {
    key = "home";
    content = viewHome();
  }
  document.getElementById("app").innerHTML = '<div class="' + (key === "home" ? "" : "view") + '">' + content + "</div>" +
    '<footer><b>SIMBAH CUP</b><span>Presented by <a href="https://simbahsports.co.uk">Simbah Sports</a></span><span>' + EMAIL + " · " + PHONE + "</span></footer>";
  if (after) after();
  document.querySelectorAll("[data-key]").forEach(function (a) {
    if (a.getAttribute("data-key") === key) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}

buildNav();
window.addEventListener("hashchange", show);
show();
loadData();
document.getElementById("lbx").addEventListener("click", closeLightbox);
document.getElementById("lb").addEventListener("click", function (e) { if (e.target.id === "lb") closeLightbox(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLightbox(); });
</script>
